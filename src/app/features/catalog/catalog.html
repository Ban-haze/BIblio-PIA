<div class="catalog-container">
  <div class="header">
    <h1>Biblioteca Virtual PIA</h1>
    <!-- Actualizamos el botón para que llame a la nueva función logout() -->
    <button class="btn-logout" (click)="logout()">Salir</button>
  </div>
  
  <div class="grid">
    <div class="card" *ngFor="let book of firebase.books()">
      <img [src]="book.coverUrl" [alt]="book.title" class="cover">
      <div class="card-body">
        <h3>{{ book.title }}</h3>
        <p>{{ book.author }}</p>
        <a [href]="book.pdfUrl" target="_blank" class="btn-read">Leer Documento</a>
      </div>
    </div>

    <div class="empty-state" *ngIf="firebase.books().length === 0">
      Cargando libros o la biblioteca está vacía...
    </div>
  </div>
</div>
